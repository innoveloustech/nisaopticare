{% extends 'base.html' %}
{% block content %}

<!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Login</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Log In To Your Account...</p>
                </div>
            </div>
        </header>

        <div class="container">
        	<div class="row">
        		<center>
        			<div class="col-8">

        				<br/><br/>
<form method="POST" action="{% url 'login' %}">
    {% csrf_token %}
    
  <div class="row mb-3 align-items-center">
    <label for="username" class="col-sm-3 col-form-label fw-bold text-start">Username</label>
    <div class="col-sm-9">
      <input type="text" class="form-control" name="username" placeholder="Enter Your Username">
    </div>
  </div>
  
  <div class="row mb-3 align-items-center">
    <label for="password" class="col-sm-3 col-form-label fw-bold text-start">Password</label>
    <div class="col-sm-9">
      <input type="password" class="form-control" name="password" placeholder="Enter Your Password">
    </div>
  </div>
  <br/><br/>
  <button type="submit" class="btn btn-secondary">Login</button>
  <a href="{% url 'register' %}" class="btn btn-outline-secondary ml-2">Register</a>
</form>

<br/><br/>
<br/><br/>
<br/><br/>
<br/><br/>
<br/><br/>
<br/><br/>
<br/><br/>
        			</div>
        		</center>
        	</div>
        </div>

{% endblock %}
