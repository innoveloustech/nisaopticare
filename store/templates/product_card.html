<div class="col mb-5">
    <div class="card h-100">
        <!-- Sale badge-->
        {% if product.is_sale %}
            <div class="badge sale-badge text-white position-absolute" style="top: 0.5rem; right: 0.5rem">Sale</div>
        {% endif %}

        <!-- Product image-->
        <img class="card-img-top" src="{{ product.image.url }}" alt="Product Image" />

        <!-- Product details-->
        <div class="card-body p-4">
            <div class="text-center">
                <!-- Product name-->
                <h5 class="fw-bolder">{{ product.name }}</h5>
                
                <!-- Sale message-->
                {% if product.is_sale %}
                    <div class="d-flex justify-content-center align-items-center mb-2">
                        <span class=" text-danger" style="background-color: transparent;">
                            🔥 On Sale Now!
                        </span>
                    </div>
                    <!-- Product price-->
                    <strike>PKR {{ product.price }}</strike>
                    <br/>
                    PKR {{ product.sale_price }}
                {% else %}
                    <!-- Product price for regular items-->
                    PKR {{ product.price }}
                {% endif %}
            </div>
        </div>

        <!-- Product actions-->
        <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
            <div class="text-center">
                <a class="btn btn-outline-dark mt-auto" href="{% url 'product' product.id %}">View Product</a>
            </div>
        </div>
    </div>
</div>
