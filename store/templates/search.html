{% extends 'base.html' %}
{% block content %}

<!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Search Products</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Find What You're Looking For...</p>
                </div>
            </div>
        </header>

        <div class="container">
        	<div class="row">
        		<center>
        			<div class="col-10">
                <br/><br/>
                  <div class="card">
                    <div class="card-header">
                      Search Products
                    </div>
                    <div class="card-body">
                      <form method="GET" action="{% url 'search' %}">
                        <div class="mb-3">
                          <input type="text" class="form-control" placeholder="Search For Products" name="search_key" value="{{ request.GET.search_key }}">
                        </div>
                        <button type="submit" class="btn btn-secondary">Search Products</button>
                      </form>

                    </div>
                  </div>
                  <br/><br/>


                  <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">

                    {% if searched %}
                        {% for product in searched %}
                            {% include 'product_card.html' with product=product %}
                        {% endfor %}
                    {% endif %}
                  </div>

                <br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/>
              </div>
        		</center>
        	</div>
        </div>

{% endblock %}
